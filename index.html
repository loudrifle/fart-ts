<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fart.ts Demo</title>
    <style>
      body { font-family: sans-serif; max-width: 600px; margin: 2rem auto; }
      button { margin: 4px; padding: 8px 14px; cursor: pointer; }
      #scroller { height: 200px; overflow: scroll; border: 1px solid #333; width: 200px; }
      #scroller-inner { height: 500px; padding: 8px; }
    </style>
  </head>
  <body>
    <h1>Fart Sounds</h1>
    <div id="farts"></div>

    <h1>Loop</h1>
    <button id="start">Start (looped)</button>
    <button id="stop">Stop</button>

    <h1>Volume</h1>
    <button class="volume" data-level="20">Vol 20</button>
    <button class="volume" data-level="50">Vol 50</button>
    <button class="volume" data-level="100">Vol 100</button>

    <h1>Random on scroll</h1>
    <div id="scroller">
      <div id="scroller-inner">Scroll me...</div>
    </div>

    <script type="module" src="/main.ts"></script>
  </body>
</html>
